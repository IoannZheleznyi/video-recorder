ServerName localhost
Timeout 300
WSGISocketPrefix /var/run/apache2/wsgi

<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost

    LimitRequestBody 524288000

    WSGIDaemonProcess video_service processes=2 threads=8 python-home=/opt/venv python-path=/app lang='C.UTF-8' locale='C.UTF-8' display-name=%{GROUP}
    WSGIProcessGroup video_service
    WSGIApplicationGroup %{GLOBAL}
    WSGIImportScript /app/video_service.wsgi process-group=video_service application-group=%{GLOBAL}
    WSGIScriptAlias / /app/video_service.wsgi

    <Directory /app>
        <Files video_service.wsgi>
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>